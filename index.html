<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription des stagiaires</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    #message { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; }
    #message.ok { display: block; background: #dcfce7; color: #166534; }
    #message.erreur { display: block; background: #fee2e2; color: #991b1b; }
    .lien { display: block; margin-top: 18px; text-align: center; color: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inscription d'un stagiaire</h1>

    <form id="formInscription">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required maxlength="100">

      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required maxlength="100">

      <label for="ville">Ville</label>
      <input type="text" id="ville" name="ville" required maxlength="100">

      <label for="photo">Photo</label>
      <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" required>

      <button type="submit" id="btn">Inscrire</button>
    </form>

    <div id="message"></div>
    <a class="lien" href="liste.html">Voir la liste des stagiaires →</a>
  </div>

  <script>
    const form = document.getElementById('formInscription');
    const btn = document.getElementById('btn');
    const message = document.getElementById('message');

    function afficher(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Envoi en cours...';
      message.className = '';
      message.style.display = 'none';

      try {
        const reponse = await fetch('/api/inscrire.php', {
          method: 'POST',
          body: new FormData(form)
        });
        const data = await reponse.json();

        if (data.success) {
          afficher(data.message, 'ok');
          form.reset();
        } else {
          afficher(data.message || 'Une erreur est survenue.', 'erreur');
        }
      } catch (erreur) {
        afficher('Impossible de contacter le serveur.', 'erreur');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Inscrire';
      }
    });
  </script>
</body>
</html>
